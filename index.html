<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>NAZE AI — Think. Create. Solve.</title>
<meta name="description" content="NAZE AI — Think. Create. Solve. Asisten AI untuk chat, membaca gambar, menganalisis file, dan membantu coding.">
<meta name="theme-color" content="#0A0C12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NAZE AI">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
:root{
  --accent:#4F7CFF; --accent-2:#7C9BFF; --accent-soft:rgba(79,124,255,.14);
  --bg:#0A0C12; --surface:#12141C; --surface-2:#181B26; --surface-3:#1F2330;
  --border:#242838; --text:#E9EBF3; --text-dim:#8A90A6; --text-faint:#565C72;
  --radius:18px; --radius-sm:12px;
  --danger:#F4536B; --ok:#3DD9A4;
}
[data-theme="light"]{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#F0F1F5; --surface-3:#E7E9EF;
  --border:#E3E5EC; --text:#14151C; --text-dim:#666C80; --text-faint:#9AA0B4;
  --accent-soft:rgba(79,124,255,.10);
}
[data-accent="purple"]{--accent:#8B5CF6;--accent-2:#A78BFA;}
[data-accent="cyan"]{--accent:#06B6D4;--accent-2:#22D3EE;}
[data-accent="green"]{--accent:#10B981;--accent-2:#34D399;}
[data-accent="red"]{--accent:#F4436B;--accent-2:#FB7189;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; overscroll-behavior:none;}
body{
  background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand,.logo-wrap{font-family:'Space Grotesk',sans-serif;}
::selection{background:var(--accent-soft); color:var(--text);}
button{font-family:inherit; cursor:pointer;}
a{color:var(--accent-2);}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}

/* ===== App shell ===== */
#app{display:flex; height:100vh; height:100dvh; width:100vw; overflow:hidden;}

/* ===== Sidebar ===== */
#sidebar{
  width:272px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; transition:transform .25s ease; z-index:40;
}
#sidebar .side-top{padding:16px 14px 8px;}
.brand-row{display:flex; align-items:center; gap:10px; padding:6px 6px 14px;}
.logo-mark{width:30px; height:30px; flex-shrink:0; position:relative;}
.logo-mark svg{width:100%; height:100%; display:block;}
.brand{font-weight:700; font-size:17px; letter-spacing:.2px;}
.brand .dot{color:var(--accent);}
.new-chat-btn{
  display:flex; align-items:center; gap:9px; width:100%; padding:11px 13px; border-radius:var(--radius-sm);
  background:var(--accent); color:#fff; border:none; font-weight:600; font-size:14px;
  box-shadow:0 4px 14px -6px var(--accent);
}
.new-chat-btn:hover{filter:brightness(1.08);}
.search-wrap{position:relative; margin-top:10px;}
.search-wrap input{
  width:100%; padding:9px 12px 9px 34px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:13.5px;
}
.search-wrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.5; width:15px; height:15px;}
#chat-list{flex:1; overflow-y:auto; padding:10px 10px 6px;}
.chat-group-label{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint); padding:12px 8px 6px; font-weight:600;}
.chat-item{
  display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:10px; margin-bottom:2px;
  color:var(--text-dim); font-size:13.5px; position:relative; group:hover;
}
.chat-item:hover, .chat-item.active{background:var(--surface-2); color:var(--text);}
.chat-item.active{color:var(--text);}
.chat-item .ttl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.chat-item .actions{display:none; gap:4px;}
.chat-item:hover .actions{display:flex;}
.chat-item .actions button{background:none; border:none; color:var(--text-faint); padding:3px; border-radius:6px;}
.chat-item .actions button:hover{color:var(--danger); background:var(--surface-3);}
.side-bottom{padding:10px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:2px;}
.side-btn{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; border:none; background:none;
  color:var(--text-dim); font-size:13.5px; width:100%; text-align:left;
}
.side-btn:hover{background:var(--surface-2); color:var(--text);}
#sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:35;}

/* ===== Main column ===== */
#main{flex:1; display:flex; flex-direction:column; min-width:0; position:relative;}
#topbar{
  display:flex; align-items:center; justify-content:space-between; padding:10px 16px; gap:10px;
  border-bottom:1px solid var(--border); flex-shrink:0; background:var(--bg);
}
.icon-btn{
  display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px;
  border:1px solid transparent; background:none; color:var(--text-dim);
}
.icon-btn:hover{background:var(--surface-2); color:var(--text);}
#topbar .title{font-weight:600; font-size:14.5px; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.mode-pill{
  font-size:11.5px; padding:3px 9px; border-radius:20px; background:var(--accent-soft); color:var(--accent-2);
  font-weight:600; display:flex; align-items:center; gap:5px;
}
#topbar-right{display:flex; align-items:center; gap:6px;}

/* ===== Scroll area ===== */
#scroll{flex:1; overflow-y:auto; padding:22px 0 10px;}
#thread{max-width:780px; margin:0 auto; padding:0 16px; display:flex; flex-direction:column; gap:22px;}

/* ===== Welcome ===== */
#welcome{max-width:680px; margin:0 auto; padding:8vh 20px 20px; text-align:center;}
#welcome .logo-wrap{width:64px; height:64px; margin:0 auto 18px; position:relative; perspective:700px;}
#welcome .logo-wrap::before{
  content:''; position:absolute; inset:-16px; border-radius:50%; z-index:0;
  background:radial-gradient(circle, var(--accent-soft) 0%, transparent 72%);
  opacity:0; transform:scale(.55);
  animation: logoGlow 20s cubic-bezier(.45,0,.2,1) infinite;
}
#welcome .logo-flip{
  width:100%; height:100%; position:relative; z-index:1;
  transform-style:preserve-3d;
  animation: logoFlipZ 20s cubic-bezier(.65,0,.35,1) infinite;
}
#welcome .logo-face{
  position:absolute; inset:0;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
}
#welcome .logo-face svg{display:block; width:100%; height:100%;}
#welcome .logo-face.logo-back{ transform:rotateY(180deg); }

/* Idle almost the entire cycle; around the 4–13% mark (~0.8s–2.6s into
   each 20s loop) the mark performs one smooth, easing flip that reveals
   the "Z" briefly on its back face, then eases back to the original mark. */
@keyframes logoFlipZ{
  0%{ transform:rotateY(0deg); }
  5%{ transform:rotateY(180deg); }      /* fully flipped: shows the Z face */
  9%{ transform:rotateY(180deg); }      /* brief hold so the Z reads clearly */
  14%, 100%{ transform:rotateY(360deg); } /* eases back to the original mark, then holds still */
}
@keyframes logoGlow{
  0%, 2%, 100%{ opacity:0; transform:scale(.55); }
  5%{ opacity:.9; transform:scale(1.15); }
  14%{ opacity:0; transform:scale(1.4); }
}
@media (prefers-reduced-motion: reduce){
  #welcome .logo-wrap::before, #welcome .logo-flip{animation:none;}
}
#welcome h1{font-size:26px; margin:0 0 6px; font-weight:700;}
#welcome p.sub{color:var(--text-dim); font-size:15px; margin:0 0 30px;}
.suggest-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.suggest-card{
  text-align:left; padding:14px 15px; border-radius:14px; border:1px solid var(--border); background:var(--surface);
  color:var(--text-dim); font-size:13.5px; line-height:1.4; transition:border-color .15s, transform .15s;
}
.suggest-card:hover{border-color:var(--accent); color:var(--text); transform:translateY(-1px);}
.suggest-card .ic{font-size:17px; margin-bottom:6px; display:block;}
@media (max-width:560px){.suggest-grid{grid-template-columns:1fr; }}

/* ===== Messages ===== */
.msg-row{display:flex; gap:11px; align-items:flex-start;}
.msg-row.user{flex-direction:row-reverse;}
.avatar{
  width:30px; height:30px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); border:1px solid var(--border); margin-top:2px;
}
.avatar.ai{background:linear-gradient(135deg,var(--accent),var(--accent-2)); border:none;}
.avatar.ai svg{width:16px;height:16px;color:#fff;}
.bubble-col{display:flex; flex-direction:column; gap:6px; max-width:80%; min-width:0;}
.msg-row.user .bubble-col{align-items:flex-end;}
.bubble{
  padding:11px 15px; border-radius:var(--radius); font-size:14.8px; line-height:1.6; word-wrap:break-word;
}
.msg-row.user .bubble{background:var(--accent); color:#fff; border-bottom-right-radius:5px; white-space:pre-wrap;}
.msg-row.ai .bubble{background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:5px;}
.bubble p{margin:0 0 10px;} .bubble p:last-child{margin-bottom:0;}
.bubble h1,.bubble h2,.bubble h3{margin:14px 0 8px; font-family:'Space Grotesk',sans-serif;}
.bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child{margin-top:0;}
.bubble ul,.bubble ol{margin:0 0 10px; padding-left:22px;}
.bubble li{margin-bottom:3px;}
.bubble blockquote{border-left:3px solid var(--accent); margin:10px 0; padding:2px 14px; color:var(--text-dim); background:var(--accent-soft); border-radius:0 8px 8px 0;}
.bubble table{border-collapse:collapse; width:100%; margin:10px 0; font-size:13.5px; display:block; overflow-x:auto;}
.bubble th,.bubble td{border:1px solid var(--border); padding:6px 10px; text-align:left;}
.bubble th{background:var(--surface-2); font-weight:600;}
.bubble code{background:var(--surface-2); padding:2px 6px; border-radius:5px; font-family:'JetBrains Mono',monospace; font-size:.87em;}
.msg-row.user .bubble code{background:rgba(255,255,255,.18);}
.bubble pre{margin:10px 0; border-radius:12px; overflow:hidden; border:1px solid var(--border); background:#161822;}
.code-head{display:flex; justify-content:space-between; align-items:center; padding:8px 13px; background:#1B1E2A; font-size:12px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}
.copy-btn{display:flex; align-items:center; gap:5px; background:none; border:none; color:var(--text-dim); font-size:12px; padding:3px 7px; border-radius:6px;}
.copy-btn:hover{background:var(--surface-3); color:var(--text);}
.bubble pre code.hljs{padding:13px 15px; display:block; overflow-x:auto; font-size:13px; font-family:'JetBrains Mono',monospace; background:transparent;}

/* attachments in bubble */
.att-row{display:flex; flex-wrap:wrap; gap:8px;}
.att-chip{
  display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:12px; background:var(--surface-2);
  border:1px solid var(--border); font-size:12.5px; max-width:220px;
}
.msg-row.user .att-chip{background:rgba(255,255,255,.14); border-color:transparent; color:#fff;}
.att-chip img{width:34px; height:34px; border-radius:8px; object-fit:cover; flex-shrink:0;}
.att-chip .ic{width:34px; height:34px; border-radius:8px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
.att-meta{overflow:hidden;}
.att-meta .n{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500;}
.att-meta .s{opacity:.65; font-size:11px;}

.msg-actions{display:flex; gap:2px; margin-top:2px;}
/* di desktop (mouse), tombol aksi muncul halus saat hover; di HP/tablet (layar sentuh) selalu tampil */
@media (hover:hover) and (pointer:fine){
  .msg-actions{opacity:0; transition:opacity .15s;}
  .bubble-col:hover .msg-actions{opacity:1;}
  .bubble-col:focus-within .msg-actions{opacity:1;}
}
.msg-actions button{
  display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:8px;
  border:none; background:none; color:var(--text-faint); position:relative;
}
.msg-actions button:hover{background:var(--surface-2); color:var(--text);}
.msg-actions button.active-like{color:var(--ok);}
.msg-actions button.active-dislike{color:var(--danger);}
.msg-actions button.copied{color:var(--ok);}
.msg-actions .copy-tip{
  position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%) translateY(4px);
  background:var(--surface-3); color:var(--text); font-size:11px; font-weight:600; padding:4px 8px; border-radius:7px;
  white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s, transform .15s; box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.msg-actions button.copied .copy-tip{opacity:1; transform:translateX(-50%) translateY(0);}

.thinking-row{display:flex; align-items:center; gap:9px; color:var(--text-dim); font-size:13.5px; padding:2px 0;}
.orbit{width:16px; height:16px; position:relative; flex-shrink:0;}
.orbit i{position:absolute; width:4px; height:4px; border-radius:50%; background:var(--accent); top:6px; left:6px; animation:orbit 1.1s linear infinite;}
.orbit i:nth-child(2){animation-delay:-.37s; opacity:.7;}
.orbit i:nth-child(3){animation-delay:-.74s; opacity:.45;}
@keyframes orbit{
  0%{transform:rotate(0deg) translateX(7px) rotate(0deg);}
  100%{transform:rotate(360deg) translateX(7px) rotate(-360deg);}
}
.cursor-blink{display:inline-block; width:7px; height:15px; background:var(--accent); margin-left:2px; vertical-align:middle; animation:blink 1s step-start infinite; border-radius:2px;}
@keyframes blink{50%{opacity:0;}}

/* ===== Naze Browse (auto browsing) ===== */
.browse-row{display:flex; align-items:center; gap:9px; color:var(--text-dim); font-size:13.5px; padding:2px 0;}
.browse-row .globe-spin{width:16px; height:16px; flex-shrink:0; color:var(--accent); animation:naze-spin 1.6s linear infinite;}
@keyframes naze-spin{to{transform:rotate(360deg);}}
.sources-card{margin-top:8px; border:1px solid var(--border); border-radius:12px; padding:10px 12px; background:var(--surface-2);}
.sources-head{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px; margin-bottom:8px;}
.sources-head svg{color:var(--accent); flex-shrink:0;}
.sources-list{display:flex; flex-direction:column; gap:6px;}
.source-chip{display:flex; flex-direction:column; gap:1px; padding:7px 9px; border-radius:9px; background:var(--surface); border:1px solid var(--border); text-decoration:none; transition:border-color .15s;}
.source-chip:hover{border-color:var(--accent);}
.source-chip .s-title{font-size:12.5px; color:var(--text); font-weight:600; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical;}
.source-chip .s-domain{font-size:11px; color:var(--text-dim);}
.sources-queries{margin-top:8px; padding-top:8px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text-dim);}
#browse-seg button svg{flex-shrink:0;}
.err-box{
  display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:12px; background:rgba(244,83,107,.1);
  border:1px solid rgba(244,83,107,.3); color:var(--danger); font-size:13.5px;
}
.err-box button{margin-left:auto; background:var(--danger); color:#fff; border:none; padding:5px 12px; border-radius:8px; font-size:12.5px; font-weight:600; flex-shrink:0;}

/* ===== Composer ===== */
#composer-wrap{padding:12px 16px calc(12px + env(safe-area-inset-bottom)); flex-shrink:0;}
#composer{
  max-width:780px; margin:0 auto; border:1px solid var(--border); border-radius:22px; background:var(--surface);
  padding:8px 8px 8px 8px; box-shadow:0 8px 30px -14px rgba(0,0,0,.35);
}
#preview-strip{display:flex; gap:8px; flex-wrap:wrap; padding:6px 6px 2px;}
.pv-chip{
  position:relative; display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:12px; background:var(--surface-2);
  border:1px solid var(--border); font-size:12px; max-width:190px;
}
.pv-chip img{width:32px; height:32px; border-radius:7px; object-fit:cover;}
.pv-chip .ic{width:32px; height:32px; border-radius:7px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:15px;}
.pv-chip .n{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100px; font-weight:500;}
.pv-chip .s{opacity:.6; font-size:10.5px;}
.pv-chip .rm{width:16px; height:16px; border-radius:50%; background:var(--surface-3); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-left:auto; color:var(--text-dim);}
.pv-chip .rm:hover{background:var(--danger); color:#fff;}
.pv-chip .bar{position:absolute; bottom:0; left:0; height:2px; background:var(--accent); border-radius:0 0 12px 12px; transition:width .2s;}

#input-row{display:flex; align-items:flex-end; gap:6px;}
#plus-btn{
  width:38px; height:38px; border-radius:50%; border:none; background:var(--surface-2); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-bottom:2px;
}
#plus-btn:hover{background:var(--surface-3); color:var(--text);}
#composer textarea{
  flex:1; resize:none; border:none; background:none; color:var(--text); font-size:15px; font-family:inherit;
  padding:9px 4px; max-height:180px; line-height:1.5;
}
#composer textarea:focus{outline:none;}
#composer textarea::placeholder{color:var(--text-faint);}
#think-toggle{
  display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:20px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text-dim); font-size:12.5px; font-weight:600; flex-shrink:0; margin-bottom:2px; white-space:nowrap;
}
#think-toggle.on{background:var(--accent-soft); color:var(--accent-2); border-color:var(--accent);}
#send-btn{
  width:38px; height:38px; border-radius:50%; border:none; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-bottom:2px;
}
#send-btn:disabled{opacity:.35;}
#send-btn.stop{background:var(--text);}
[data-theme="light"] #send-btn.stop{background:var(--text);}
.hint{text-align:center; font-size:11px; color:var(--text-faint); margin-top:8px;}

/* + menu */
#plus-menu{
  position:absolute; bottom:64px; left:16px; background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:6px; display:none; flex-direction:column; min-width:190px; box-shadow:0 10px 30px -8px rgba(0,0,0,.4); z-index:20;
}
#plus-menu.show{display:flex;}
#plus-menu button{
  display:flex; align-items:center; gap:10px; padding:10px 11px; border-radius:10px; border:none; background:none;
  color:var(--text); font-size:13.5px; text-align:left; width:100%;
}
#plus-menu button:hover{background:var(--surface-2);}

/* ===== Panels (settings/about) ===== */
.panel-overlay{position:fixed; inset:0; background:rgba(0,0,
